name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm fetch:assets
      - run: pnpm build
      - run: pnpm check:registry
      - run: pnpm test
      - run: pnpm conf:interp
      - run: pnpm conf:compiled
      - run: pnpm conf:lua
      - run: pnpm conf:py
      - run: pnpm conf:roundtrip
      - run: pnpm conf:roundtrip-lua
      - run: pnpm conf:roundtrip-py
      - run: pnpm fuzz
