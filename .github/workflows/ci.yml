name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm fetch:assets
      - run: pnpm build
      - run: pnpm check:registry
      - run: pnpm test
      - run: pnpm conf:interp
      - run: pnpm conf:compiled
      - run: pnpm conf:lua
      - run: pnpm conf:py
      - run: pnpm conf:cs
      - run: pnpm conf:roundtrip
      - run: pnpm conf:roundtrip-lua
      - run: pnpm conf:roundtrip-py
      - run: pnpm conf:roundtrip-cs
      # conf:gd (compiled GDScript, pre-existing) and conf:roundtrip-gd (this
      # task's new GDScript round-trip gate) are intentionally NOT run here.
      # conf:gd genuinely needs a real `godot --headless` binary on PATH
      # (run-compiled-gd.ts's GdSession spawns one), which this runner
      # doesn't install (unlike .NET, set up above for the C# gates) — do
      # NOT add a Godot install step here. conf:roundtrip-gd is DIFFERENT:
      # @gltfi/parse-gd is a pure, dependency-free, in-process parser (see
      # that package's own header — Godot 4.3 exposes no public GDScript AST
      # API, so unlike parse-py's/parse-cs's own harness-process parsers,
      # there's no language runtime to shell out to at all), so it needs NO
      # godot binary and technically COULD run here — kept out anyway purely
      # to keep the whole GDScript backend's CI footprint at zero until
      # conf:gd's own godot dependency is addressed, rather than running an
      # inconsistent "one GDScript gate but not the other" split. Run both
      # locally with Godot 4.3+ on PATH (`GLTFI_GODOT=<path>` if it's not
      # named `godot`): `pnpm conf:gd`, `pnpm conf:roundtrip-gd`.
      - run: pnpm fuzz
