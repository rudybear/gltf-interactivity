<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>glTF Interactivity Viewer</title>
  <link rel="icon" href="data:,">

  <!--
    The compiled-engine path (?engine=compiled) transpiles a KHR_interactivity
    graph to JS in-browser (see src/compiled-loader.ts), loads it from a
    `blob:` module URL via dynamic import(), and that module's own
    `import { createEngine, m } from "@gltfi/runtime-lib";` statement needs
    somewhere to resolve to — browsers resolve a bare specifier in ANY module
    script (blob: origin included) against the document's own import map, so
    one entry here is all that's needed. The target is a self-contained
    bundle (see scripts/bundle-runtime-lib.mjs, run as predev/prebuild)
    written to public/, which Vite serves at this exact path in both `vite`
    (dev) and `vite build && vite preview`.
  -->
  <script type="importmap">
    { "imports": { "@gltfi/runtime-lib": "/gltfi-runtime-lib.mjs" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
